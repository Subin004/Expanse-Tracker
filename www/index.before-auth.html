<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
</head>

<body>
    <div class="container">
        <section id="auth-section">
            <h1>Expense Tracker</h1>
            <p class="auth-intro">
                Create an account or log in to manage your personal expenses.
            </p>

            <form id="auth-form">
                <label class="sr-only" for="auth-email">Email address</label>
                <input
                    type="email"
                    id="auth-email"
                    placeholder="Email address"
                    autocomplete="email"
                    required
                />

                <label class="sr-only" for="auth-password">Password</label>
                <input
                    type="password"
                    id="auth-password"
                    placeholder="Password (8+ characters)"
                    autocomplete="current-password"
                    minlength="8"
                    required
                />

                <button type="submit">Log In</button>
                <button
                    type="button"
                    id="register-button"
                    class="secondary-button"
                >
                    Create Account
                </button>

                <p
                    id="auth-message"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                ></p>
            </form>
        </section>

        <section id="tracker-section" hidden>
            <div class="app-header">
                <h1>Expense Tracker</h1>

                <div class="account-actions">
                    <span id="current-user"></span>
                    <button
                        type="button"
                        id="logout-button"
                        class="secondary-button"
                    >
                        Log Out
                    </button>
                </div>
            </div>

            <form id="expense-form">
                <label class="sr-only" for="expense-name">Expense name</label>
                <input
                    type="text"
                    id="expense-name"
                    placeholder="Expense Name"
                    required
                    aria-describedby="form-message"
                />

                <label class="sr-only" for="expense-amount">Amount</label>
                <input
                    type="number"
                    id="expense-amount"
                    placeholder="Amount"
                    min="0.01"
                    step="0.01"
                    inputmode="decimal"
                    required
                    aria-describedby="form-message"
                />

                <label class="sr-only" for="expense-category">Category</label>
                <select id="expense-category" required aria-describedby="form-message">
                    <option value="" disabled selected>Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <label class="sr-only" for="expense-date">Expense date</label>
                <input
                    type="date"
                    id="expense-date"
                    required
                    aria-describedby="form-message"
                />

                <button type="submit">Add Expense</button>

                <p
                    id="form-message"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                ></p>
            </form>

            <div class="expense-table">
                <table>
                    <thead>
                        <tr>
                            <th>Expense Name</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expense-list"></tbody>
                </table>

                <div class="total-amount">
                    <strong>Total:</strong> ₹<span id="total-amount">0</span>
                </div>
            </div>

            <div class="filter">
                <label for="filter-category">Filter by Category:</label>
                <select id="filter-category">
                    <option value="All">All</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </section>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
