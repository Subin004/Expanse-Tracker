<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
</head>

<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <form id="expense-form">
            <label class="sr-only" for="expense-name">Expense name</label>
            <input type="text" id="expense-name" placeholder="Expense Name" required aria-describedby="form-message" />
            <label class="sr-only" for="expense-amount">Amount</label>
            <input type="number" id="expense-amount" placeholder="Amount" min="0.01" step="0.01" inputmode="decimal" required aria-describedby="form-message" />
            <label class="sr-only" for="expense-category">Category</label>
            <select id="expense-category" required aria-describedby="form-message">
                <option value="" disabled selected>Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>
            <label class="sr-only" for="expense-date">Expense date</label>
            <input type="date" id="expense-date" required aria-describedby="form-message" />
            <button type="submit">Add Expense</button>
            <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
        </form>
        <div class="expense-table">
            <table>
                <thead>
                    <tr>
                        <th>Expense Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="expense-list"></tbody>
            </table>
            <div class="total-amount">
                <strong>Total:</strong> ₹<span id="total-amount">0</span>
            </div>
        </div>
        <div class="filter">
            <label for="filter-category">Filter by Category:</label>
            <select id="filter-category">
                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>

</html>
